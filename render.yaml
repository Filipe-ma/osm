services:
  - type: web
    name: osm-microcredito
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn core.wsgi:application --workers=2 --threads=4 --timeout=120 --log-file=-
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    # healthCheckPath: /login/
    # autoDeploy: true
