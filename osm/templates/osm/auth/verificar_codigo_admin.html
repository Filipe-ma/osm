<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificação de Acesso — OSM</title>
{% load static %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a1628;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:40px 36px;max-width:440px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.icon{font-size:48px;color:#c9a84c;margin-bottom:20px}
.title{font-size:22px;font-weight:800;color:#e2e8f0;margin-bottom:8px}
.subtitle{font-size:13.5px;color:rgba(255,255,255,.4);margin-bottom:32px;line-height:1.6}
.code-input{width:100%;padding:14px;background:rgba(255,255,255,.06);
  border:2px solid rgba(255,255,255,.12);border-radius:12px;color:#e2e8f0;
  font-family:'Space Mono',monospace;font-size:20px;font-weight:700;text-align:center;
  letter-spacing:6px;outline:none;transition:.2s;margin-bottom:6px}
.code-input:focus{border-color:#c9a84c;box-shadow:0 0 0 3px rgba(201,168,76,.15)}
.code-input.error{border-color:#ef5350;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.err-msg{font-size:12.5px;color:#ef9a9a;margin-bottom:16px;display:none}
.err-msg.show{display:block}
.btn{display:inline-flex;align-items:center;gap:8px;width:100%;padding:14px;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;
  font-family:'Plus Jakarta Sans',sans-serif;transition:.2s;justify-content:center;margin-top:8px}
.btn-primary{background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;
  box-shadow:0 4px 16px rgba(21,101,192,.35)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(21,101,192,.45)}
.btn-back{background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);
  border:1px solid rgba(255,255,255,.08);font-size:13px;padding:10px}
.btn-back:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.hint{font-size:11px;color:rgba(255,255,255,.2);margin-top:20px}
</style>
</head>
<body>
<div class="box">
  <div class="icon"><i class="fa-solid fa-key"></i></div>
  <div class="title">Acesso Restrito</div>
  <div class="subtitle">
    Esta área requer um código de acesso especial.<br>
    Introduza o código para continuar.
  </div>

  <form method="post">
    {% csrf_token %}
    <input type="password" name="codigo" class="code-input {% if erro %}error{% endif %}"
           id="codeInput" maxlength="9" placeholder="•••••••••"
           autocomplete="off" autofocus required>
    <div class="err-msg {% if erro %}show{% endif %}">
      <i class="fa-solid fa-circle-xmark"></i> Código incorreto. Tente novamente.
    </div>
    <button type="submit" class="btn btn-primary">
      <i class="fa-solid fa-unlock-keyhole"></i> Verificar Acesso
    </button>
  </form>

  <a href="{% url 'painel' %}" class="btn btn-back" style="display:flex;margin-top:10px">
    <i class="fa-solid fa-arrow-left"></i> Voltar ao Painel
  </a>

  <div class="hint">
    <i class="fa-solid fa-shield-halved"></i>
    Acesso limitado ao Super Administrador do sistema
  </div>
</div>

<script>
// Formatar input como código
document.getElementById('codeInput').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9]/g, '');
});
</script>
</body>
</html>
