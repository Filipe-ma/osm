<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>OSM — Sem Ligação</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0a1628;
  color: #e2e8f0;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 40px 32px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  animation: fadeUp .4s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

.icon {
  width: 72px; height: 72px; border-radius: 18px;
  background: rgba(198,40,40,.15);
  border: 1px solid rgba(198,40,40,.3);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 22px;
  animation: pulse 2.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.3)} 50%{box-shadow:0 0 0 10px rgba(198,40,40,0)} }

h1 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
p  { font-size: 13.5px; color: #64748b; line-height: 1.65; margin-bottom: 28px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 20px; border-radius: 10px; font-size: 13.5px; font-weight: 700;
  cursor: pointer; border: none; font-family: inherit; width: 100%;
  background: linear-gradient(135deg, #1565c0, #0d47a1);
  color: #fff; box-shadow: 0 4px 16px rgba(21,101,192,.3);
  text-decoration: none; margin-bottom: 10px;
}
.btn:hover { filter: brightness(1.1); }
.btn-sec {
  background: rgba(255,255,255,.06);
  color: #94a3b8;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow: none;
}
.status {
  margin-top: 22px; padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,.06);
  font-size: 11px; color: #334155;
}
.dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: #ef9a9a; margin-right: 5px;
  animation: blink 1.5s ease-in-out infinite;
}
.dot.online { background: #4ade80; animation: none; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.spin { animation: spin 1s linear infinite; display:inline-block; }
@keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ef9a9a" stroke-width="2" stroke-linecap="round">
      <line x1="2" y1="2" x2="22" y2="22"/>
      <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
      <path d="M2 8.82a15 15 0 0 1 4.17-2.65"/>
      <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/>
      <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/>
      <path d="M5 12.99a10 10 0 0 1 5.17-2.39"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>

  <h1>Sem Ligação à Internet</h1>
  <p>O OSM Microcrédito necessita de internet para funcionar.<br>Verifique a sua ligação e tente novamente.</p>

  <button class="btn" onclick="retry()" id="retry-btn">
    <span id="retry-icon">↻</span>
    <span id="retry-text">Tentar Novamente</span>
  </button>
  <a href="/painel/" class="btn btn-sec">← Ir para o Painel</a>

  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">Sem ligação</span>
  </div>
</div>

<script>
function updateStatus() {
  const online = navigator.onLine;
  document.getElementById('dot').className = 'dot' + (online ? ' online' : '');
  document.getElementById('status-text').textContent = online ? 'Ligação detectada — a redirecionar…' : 'Sem ligação à internet';
  if (online) setTimeout(() => location.href = '/painel/', 1000);
}

window.addEventListener('online', updateStatus);
setInterval(updateStatus, 4000);
updateStatus();

function retry() {
  const btn  = document.getElementById('retry-btn');
  const icon = document.getElementById('retry-icon');
  const txt  = document.getElementById('retry-text');
  btn.disabled = true;
  icon.className = 'spin'; icon.textContent = '↻';
  txt.textContent = 'A verificar…';
  setTimeout(() => {
    if (navigator.onLine) {
      location.href = '/painel/';
    } else {
      btn.disabled = false;
      icon.className = ''; icon.textContent = '↻';
      txt.textContent = 'Tentar Novamente';
    }
  }, 1800);
}
</script>
</body>
</html>
