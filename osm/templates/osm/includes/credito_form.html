{% load humanize %}
<div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h4 style="margin:0"><i class="fa-solid fa-plus-circle"></i> Adicionar Crédito</h4>
    <button class="btn btn-secondary btn-sm"
            hx-get="{% url 'creditos_lista' emp.pk %}"
            hx-target="#creditos-container"
            hx-swap="innerHTML"
            hx-indicator="#spinner-cancel">
      <i class="fa-solid fa-xmark"></i> Cancelar
      <span id="spinner-cancel" class="htmx-indicator" style="display: none;"><span class="btn-spinner"></span></span>
    </button>
  </div>
  <form hx-post="{% url 'adicionar_credito' emp.pk %}"
        hx-target="#creditos-container"
        hx-swap="innerHTML"
        hx-indicator="#spinner-submit">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label form-label-required">Valor do Crédito (MT)</label>
      <input type="number" step="0.01" name="valor" class="form-control" required>
    </div>
    <div class="form-grid-2" style="gap: 12px;">
      <div class="form-group">
        <label class="form-label">Taxa de Juros (%)</label>
        <input type="number" step="0.5" name="taxa_juros" class="form-control" value="30">
      </div>
      <div class="form-group">
        <label class="form-label">Taxa de Multa (%/dia)</label>
        <input type="number" step="0.5" name="taxa_multa" class="form-control" value="2">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Dias de tolerância para multa</label>
      <input type="number" name="prazo_multa_dias" class="form-control" value="5">
    </div>
    <div class="form-group">
      <label class="form-label">Data de Início</label>
      <input type="date" name="data_inicio" class="form-control" value="{{ emp.data_inicio|date:'Y-m-d' }}">
    </div>
    <div class="form-group">
      <label class="form-label">Data de Vencimento (opcional)</label>
      <input type="date" name="data_vencimento" class="form-control">
      <div class="form-hint">Se vazio, será calculado a partir da data de início (padrão 30 dias).</div>
    </div>
    <div class="osm-modal-footer" style="padding-left: 0; padding-right: 0;">
      <button type="submit" class="btn btn-primary" id="submitCreditoBtn">
        <span class="btn-text">Adicionar Crédito</span>
        <span id="spinner-submit" class="htmx-indicator" style="display: none;"><span class="btn-spinner"></span></span>
      </button>
    </div>
  </form>
</div>
